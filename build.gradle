plugins {
  id 'java-library'
  id 'idea'
  id 'maven-publish'
  id 'net.neoforged.moddev' version '2.0.105'
  id "es.degrassi.unified-publishing-with-mmr-bot" version "1.3.1"
  id "io.freefair.lombok" version "9.2.0"
}

tasks.named('wrapper', Wrapper).configure {
  distributionType = Wrapper.DistributionType.BIN
}

base {
  archivesName = archives_base_name
  version = "${minecraft_version}-${mod_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

tasks.processResources {
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

neoForge {
  version = project.neo_version

  parchment {
    mappingsVersion = project.parchment_mappings_version
    minecraftVersion = project.parchment_minecraft_version
  }

  accessTransformers.from project.files("src/main/resources/META-INF/accesstransformer.cfg")

  runs {
    client {
      client()
      systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }
    server {
      server()
      programArgument "--nogui"
      systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }
    gameTestServer {
      type = "gameTestServer"
      systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }
    data {
      data()
      programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
    configureEach {
      systemProperty 'forge.logging.markers', 'REGISTRIES'
      logLevel = org.slf4j.event.Level.DEBUG
    }
  }

  mods {
    "${mod_id}" {
      sourceSet(sourceSets.main)
    }
  }
}

// Include resources generated by data generators.
sourceSets.main.resources {
  srcDir 'src/generated/resources'
  exclude '.cache/'
}

configurations {
  libraries
  // This will make sure that all dependencies that you add to the libraries configuration will also be added to the implementation configuration
  // This way, you only need one dependency declaration for both runtime and compile dependencies
  implementation.extendsFrom libraries
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    url = "https://repo.spongepowered.org/repository/maven-public/"
  }
  maven {
    name = "Forge"
    url = "https://maven.minecraftforge.net"
  }
  maven {
    // jei, ars patchouli
    name = "Jared's maven"
    url = "https://maven.blamejared.com/"
    content {
      includeGroup "mezz.jei"
      includeGroup "com.hollingsworth.ars_nouveau"
      includeGroup "com.hollingsworth.nuggets"
      includeGroup "vazkii.patchouli"
      includeGroup "com.almostreliable.mods"
    }
  }
  maven {
    // cloth config
    name = "Shedaniel's maven"
    url = "https://maven.shedaniel.me/"
    content {
      includeGroup "me.shedaniel.cloth"
    }
  }
  maven {
    name = "Illusive Soulworks maven"
    url = "https://maven.theillusivec4.top/"
  }
  maven {
    // latvian mods
    name = "Lat's maven"
    url "https://maven.latvian.dev/releases"
    content {
      includeGroup "dev.latvian.mods"
      includeGroup "dev.latvian.apps"
    }
  }
  maven {
    url 'https://jitpack.io'
    content {
      includeGroup "com.github.rtyley"
    }
  }
  maven {
    // architectury
    url = "https://maven.architectury.dev"
    content {
      includeGroup "dev.architectury"
    }
  }
  maven {
    // ToP, mekanism appeng
    name = "Mod maven"
    url = "https://modmaven.dev/"
    content {
      includeGroup "mcjty.theoneprobe"
      includeGroup "mekanism"
    }
  }
  maven {
    url "https://www.cursemaven.com"
    content {
      includeGroup "curse.maven"
    }
  }
  maven {
    name = "OctoStudios"
    url = "https://maven.octo-studios.com/releases"
  }
  maven { // TOP
    url "https://maven.k-4u.nl"
    content {
      includeGroup "mcjty.theoneprobe"
    }
  }
  maven {
    name = 'GeckoLib'
    url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    content {
      includeGroup("software.bernie.geckolib")
    }
  }
  maven {
    name = "Covers"
    // for rf stuffs
    url = "https://maven.covers1624.net"
  }
  maven {
    // emi
    name = "TerraformersMC"
    url = "https://maven.terraformersmc.com/"
    content {
      includeGroup "dev.emi"
    }
  }
  maven {
    name = "AlecRepository"
    url = 'https://maven.degrassi.es/releases'
    content {
      includeGroup "es.degrassi"
    }
  }
  maven {
    name = "terrarium"
    url = 'https://maven.teamresourceful.com/repository/maven-public/'
  }
  maven {
    // LDLib 2
    url = "https://maven.firstdarkdev.xyz/snapshots"
  }
}

dependencies {
  // lombok
  compileOnly "org.projectlombok:lombok:${project.lombok_version}"
  annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
  implementation "net.neoforged:neoforge:${neo_version}"
  compileOnly runtimeOnly("es.degrassi:modular_machinery_reborn:${minecraft_version}-${mmr_version}")
  compileOnly runtimeOnly("es.degrassi:modular_machinery_reborn_mekanism:${minecraft_version}-${mmr_mekanism_version}") { transitive = false }
  compileOnly runtimeOnly("es.degrassi:modular_machinery_reborn_ars:${minecraft_version}-${mmr_ars_version}") { transitive = false }
  compileOnly runtimeOnly("es.degrassi:experiencelib:${minecraft_version}-${experiencelib_version}") { transitive = false }
  implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all") { transitive = false }

  // ProbeJS
  runtimeOnly("curse.maven:probejs-585406:5820894")

  // JEI
  compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
  compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

  // EMI
  compileOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}:api")
  compileOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}")

  // Applied Energistics
  compileOnly runtimeOnly ("org.appliedenergistics:appliedenergistics2:${ae2_version}")
  compileOnly runtimeOnly ("curse.maven:applied-mekanistics-574300:${ae2_mekanism_version}") { transitive = false }
  compileOnly runtimeOnly ("curse.maven:ars-energistique-905641:${ae2_ars_version}") { transitive = false }
  compileOnly runtimeOnly ("es.degrassi:applied-experienced:${minecraft_version}-${appex_version}") { transitive = false }

  // Mekanism Stuff
  compileOnly("mekanism:Mekanism:${mekanism_version}:api")
  runtimeOnly("mekanism:Mekanism:${mekanism_version}:all")

  // Ars Stuff
  runtimeOnly ("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
  runtimeOnly ("vazkii.patchouli:Patchouli:1.21-${patchouli_version}")
  runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
  compileOnly runtimeOnly ("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_version}.1298") { transitive = false }

  // KubeJS
  compileOnly runtimeOnly("dev.latvian.mods:kubejs-neoforge:$kubejs_version")

  // Jade
  compileOnly runtimeOnly("curse.maven:jade-324717:${jade_version}")

  // The one probe
  compileOnly runtimeOnly("mcjty.theoneprobe:theoneprobe:${top_version}") {transitive = false}

  // LDLib2
  implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all") { transitive = false }

  // Athena
  compileOnly runtimeOnly("earth.terrarium.athena:athena-neoforge-1.21:${athena_version}")
  jarJar implementation("io.github.pedroksl:ae2addonlib:${ae2addonlib_version}-${minecraft_version}") { transitive = false }
  // setup Xei
  switch (use_Xei) {
    case "emi":
      runtimeOnly "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}"
      break
    case "jei":
      runtimeOnly ("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
      break
  }

  runtimeOnly "curse.maven:architectury-api-419699:5786327"
  runtimeOnly "curse.maven:kotlin-for-forge-351264:7471280"
  runtimeOnly("curse.maven:observable-509575:6697124")
  runtimeOnly "curse.maven:probejs-585406:7105159"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
  var replaceProperties = [
      minecraft_version      : minecraft_version,
      minecraft_version_range: minecraft_version_range,
      neo_version            : neo_version,
      neo_version_range      : neo_version_range,
      loader_version_range   : loader_version_range,
      mod_id                 : mod_id,
      mod_name               : mod_name,
      mod_license            : mod_license,
      mod_version            : mod_version,
      mod_authors            : mod_authors,
      mod_description        : mod_description,
      mod_url                : mod_url,
      icon                   : icon,
      pack_format_number     : pack_format_number,
      mekanism_version       : mekanism_version,
      mmr_version            : mmr_version,
      mmr_mekanism_version   : mmr_mekanism_version,
      mmr_ars_version        : mmr_ars_version,
      experiencelib_version  : experiencelib_version,
      athena_version         : athena_version,
      ae2_version            : ae2_version,
      appex_version          : appex_version,
      ae2_mekanism_version   : ae2_mekanism_version_string,
      ae2_ars_version        : ae2_ars_version_string,
      top_version            : top_version,
      emi_version            : emi_version,
      kubejs_version         : kubejs_version,
      jei_version            : jei_version,
      ldlib2_version         : ldlib2_version
  ]
  inputs.properties replaceProperties
  expand replaceProperties
  from "src/main/templates"
  into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
  publications {
    register('mavenJava', MavenPublication) {
      groupId = maven_group
      artifactId = archivesBaseName
      version = project.version
      from components.java

      pom {
        name = mod_name
        description = mod_description
        packaging = 'jar'
        scm {
          url = mod_github
        }
        issueManagement {
          system = 'github'
          url = mod_issues
        }
        licenses {
          license {
            name = mod_license
            distribution = 'repo'
          }
        }
        developers {
          developer {
            id = mod_authors
            name = mod_authors
            roles = ['developper']
          }
        }
      }
    }
  }
  repositories {
    maven {
      name = 'maven'
      url = 'D:\\local_maven'
    }
  }
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
  module {
    downloadSources = true
    downloadJavadoc = true
  }
}

unifiedPublishingWithMMRBot {
  project {
    displayName = "[NeoForge]ModularMachineyRebornEnergistics-${minecraft_version}-${mod_version}"
    releaseType = "release"
    if(rootProject.file("CHANGELOG.md").exists()) {
      changelog = rootProject.file("CHANGELOG.md").text
    }
    gameVersions = ["${minecraft_version}", "1.21"]
    gameLoaders = ["neoforge"]
    mainPublication jar
    modid = mod_id
    modVersion = "ModularMachineyRebornEnergistics-${minecraft_version}-${mod_version}"

    var CURSE_API_KEY = System.getenv("CURSEFORGE")
    if (CURSE_API_KEY != null) {
        curseforge {
            token = CURSE_API_KEY
            id = "1145146"
            relations {
                depends "modular-machinery-reborn"
                depends "applied-energistics-2"
                depends "experiencelib"
                optional "modular-machinery-reborn-mekanism"
                optional "modular-machinery-reborn-ars-nouveau"
                optional "applied-mekanistics"
                optional "applied-experienced"
                optional "ars-energistique"
                optional "ars-nouveau"
                optional "mekanism"
                optional "kubejs"
                optional "jei"
                optional "emi"
                optional "jade"
            }
        }
    }

    var MODRINTH_API_KEY = System.getenv("MODRINTH")
    if (MODRINTH_API_KEY != null) {
      modrinth {
        token = MODRINTH_API_KEY
        id = "XQWiHmew"
        relations {
          depends "ae2"
          depends "modular-machinery-reborn"
          depends "experiencelib"
          optional "modular-machinery-reborn-mekanism"
          optional "modular-machinery-reborn-ars-nouveau"
          optional "applied-mekanistics"
          optional "applied-experienced"
          optional "ars-energistique"
          optional "ars-nouveau"
          optional "mekanism"
          optional "kubejs"
          optional "jei"
          optional "emi"
          optional "jade"
        }
      }
    }
  }
}
